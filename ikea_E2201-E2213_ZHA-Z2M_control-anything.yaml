blueprint:
 homeassistant:
   min_version: 2024.10.0
 author: damru (modified)
 domain: automation
 name: IKEA Rodret (E2201) or IKEA Somrig (E2213) Controls (ZHA/Z2M) with Double-Press Logic
 description: >
   ## Control anything with **IKEA RODRET** or **IKEA SOMRIG** remotes with enhanced double-press control

   This modified version includes special handling for double-press sequences.

   Only for use with ZHA or Zigbee2MQTT.

   Available controls:
   - Single press on/off (Rodret) 1 dot/2 dots (Somrig) 
   - Double press on/off (Rodret, Optional) 1 dot/2 dots (Somrig)
   - Hold on/off (Rodret) 1 dot/2 dots (Somrig)
 input:
   remote_device:
     name: Remote
     description: >
       IKEA remote (Somrig, Rodret) to use.
     default: []
     selector:
       device:
         filter:
           - integration: zha
             manufacturer: IKEA of Sweden
             model: RODRET Dimmer
           - integration: zha
             manufacturer: IKEA of Sweden
             model: SOMRIG shortcut button
           - integration: mqtt
             manufacturer: IKEA
             model: RODRET wireless dimmer/power switch
           - integration: mqtt
             manufacturer: IKEA
             model: SOMRIG shortcut button
           - integration: mqtt
             manufacturer: IKEA
             model: RODRET wireless dimmer/power switch (E2201)
           - integration: mqtt
             manufacturer: IKEA
             model: SOMRIG shortcut button (E2213)
         multiple: false
   on_press_action:
     name: Press "on / 1 dot" action
     description: Choose action(s) to run when **on** (Rodret) or **1 dot** (Somrig) button is **pressed**.
     default: []
     selector:
       action: {}
   off_press_action:
     name: Press "off / 2 dots" action
     description: Choose action(s) to run when **off** (Rodret) or **2 dots** (Somrig) button is **pressed**.
     default: []
     selector:
       action: {}
   on_hold_action:
     name: Hold "on / 1 dot" action
     description: Choose action(s) to run when **on** (Rodret) or **1 dot** (Somrig) button is **held**.
     default: []
     selector:
       action: {}
   off_hold_action:
     name: Hold "off / 2 dots" action
     description: Choose action(s) to run when **off** (Rodret) or **2 dots** (Somrig) button is **held**.
     default: []
     selector:
       action: {}
   on_double_press_action:
     name: Double press "on / 1 dot" action
     description: >
       Choose action(s) to run when the **on** (Rodret) or **1 dot** (Somrig) button is **pressed twice**.
     default: []
     selector:
       action: {}
   off_double_press_action:
     name: Double press "off / 2 dots" action  
     description: >
       Choose action(s) to run when the **off** (Rodret) or **2 dots** (Somrig) button is **pressed twice**.
     default: []
     selector:
       action: {}
   helper_section:
     name: Helpers
     icon: mdi:cog-outline  
     collapsed: true
     input:
       helper_hold_delay:
         name: Hold delay
         description: Delay between the execution of the **Hold** action(s).
         default: 250
         selector:
           number:
             unit_of_measurement: milliseconds
             min: 100.0
             max: 5000.0
             step: 10.0
             mode: slider
       helper_max_loops:
         name: Max loops
         description: Maximum number of loops when holding down a button.
         default: 20
         selector:
           number:
             min: 1.0
             max: 1000.0
             step: 1.0
             mode: slider  
   rodret_options_section:
     name: Rodret options
     icon: mdi:remote
     collapsed: true
     input:
       on_double_press_exposed:
         name: Expose virtual double press "on" event
         description: >
           Choose whether or not to expose the virtual **double press** event for the **on** button.
         default: false
         selector:
           boolean: {}
       off_double_press_exposed:
         name: Expose virtual double press "off" event
         description: > 
           Choose whether or not to expose the virtual **double press** event for the **off** button.
         default: false
         selector:
           boolean: {}
       helper_double_press_delay:
         name: Double press delay
         description: >
           Max delay between button presses for double-press actions.
         default: 250
         selector:
           number:
             unit_of_measurement: milliseconds
             min: 100.0
             max: 5000.0
             step: 10.0
             mode: slider

# Here start the triggers, kept identical to original blueprint
triggers:
 # RODRET - E2201
 - platform: event
   event_type: zha_event
   event_data:
     device_id: !input remote_device
     command: "on"
     cluster_id: 6
     endpoint_id: 1
   id: press-on-zha-e2201
 # ...Keep all other original triggers...

variables:
 on_double_press_exposed: !input on_double_press_exposed
 off_double_press_exposed: !input off_double_press_exposed
 last_press_time: "{{ now() }}"
 press_state: "none"

action:
 - variables:
     on_double_press_exposed: !input on_double_press_exposed
     off_double_press_exposed: !input off_double_press_exposed
 - choose:
     - conditions: 
         - condition: trigger
           id:
             - press-on-zha-e2201
             - press-on-z2m-e2201
             - press-dots1-zha-e2213 
             - press-dots1-z2m-e2213
       sequence:
         - if:
             - condition: template
               value_template: "{{ on_double_press_exposed }}"
           then:
             - variables:
                 press_state: "on"
                 last_press_time: "{{ now() }}"
             - service: input_text.set_value
               target:
                 entity_id: input_text.last_button_press  
               data:
                 value: "on"
             - delay:
                 seconds: 5
             - if:
                 - condition: template
                   value_template: "{{ states('input_text.last_button_press') == 'on' }}"
               sequence:
                 - service: light.toggle
                   target:
                     device_id: 2ce8d590602ed6416ba65221686a1562
                 - service: input_text.set_value
                   target:
                     entity_id: input_text.last_button_press
                   data:
                     value: "none"
           else: !input on_press_action

     - conditions:
         - condition: trigger
           id: 
             - press-off-zha-e2201
             - press-off-z2m-e2201
             - press-dots2-zha-e2213
             - press-dots2-z2m-e2213
       sequence:
         - if:
             - condition: template
               value_template: "{{ off_double_press_exposed }}"
           then:
             - choose:
                 - conditions:
                     - condition: state
                       entity_id: input_text.last_button_press
                       state: "on"
                     - condition: template
                       value_template: >
                         {% set time_diff = (as_timestamp(now()) - as_timestamp(states('input_text.last_press_time'))) | int %}
                         {{ time_diff <= 5 }}
                   sequence:
                     - service: light.toggle
                       target:
                         device_id: 3c1ffa5b53410abd26f7b2cfcd04d21d
                     - service: input_text.set_value
                       target:
                         entity_id: input_text.last_button_press
                       data:
                         value: "none"
                 - conditions:
                     - condition: or
                       conditions:
                         - condition: state
                           entity_id: input_text.last_button_press
                           state: "none"
                         - condition: template
                           value_template: >
                             {% set time_diff = (as_timestamp(now()) - as_timestamp(states('input_text.last_press_time'))) | int %}
                             {{ time_diff > 5 }}
                   sequence:
                     - service: light.toggle
                       target:
                         device_id: d0150e3a4d2c83803d32045511eb9a26
           else: !input off_press_action

mode: single
max_exceeded: silent
