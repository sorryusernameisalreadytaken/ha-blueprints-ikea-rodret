blueprint:
  homeassistant:
    min_version: 2024.10.0
  author: damru (modified)
  domain: automation
  name: Simple IKEA Remote Control with Combinations
  description: Control anything with IKEA RODRET or SOMRIG remotes including button combinations
  
  input:
    remote_device:
      name: Remote
      description: IKEA remote (Somrig, Rodret) to use.
      default: []
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: IKEA of Sweden
              model: RODRET Dimmer
            - integration: zha
              manufacturer: IKEA of Sweden
              model: SOMRIG shortcut button
          multiple: false
    
    last_button_press_helper:
      name: Last Button Press Helper
      description: Helper to store the last pressed button
      selector:
        entity:
          domain: input_text
    
    last_press_time_helper:
      name: Last Press Time Helper
      description: Helper to store the timestamp of the last press
      selector:
        entity:
          domain: input_number
    
    on_press_action:
      name: Single ON Action
      description: Action for single ON press
      selector:
        action: {}
    
    off_press_action:
      name: Single OFF Action
      description: Action for single OFF press
      selector:
        action: {}
    
    combined_press_action:
      name: Combined Action
      description: Action when pressing both buttons
      selector:
        action: {}
    
    helper_combination_timeout:
      name: Combination Timeout
      description: Time window for combination detection (ms)
      default: 300
      selector:
        number:
          min: 100.0
          max: 1000.0
          unit_of_measurement: milliseconds

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote_device
      command: "on"
      cluster_id: 6
      endpoint_id: 1
    id: press-on
  
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote_device
      command: "off"
      cluster_id: 6
      endpoint_id: 1
    id: press-off

variables:
  trigger_id: "{{ trigger.id }}"
  last_press: "{{ states(last_button_press_helper) }}"
  time_diff: "{{ now().timestamp() - (states(last_press_time_helper) | float) }}"
  is_combination: >
    {{ (trigger_id == 'press-on' and last_press == 'press-off') or
       (trigger_id == 'press-off' and last_press == 'press-on') }}
  is_within_timeout: "{{ time_diff <= (helper_combination_timeout/1000) }}"

condition: []

action:
  - if:
      - condition: template
        value_template: "{{ is_combination and is_within_timeout }}"
    then: !input combined_press_action
    else:
      - if:
          - condition: trigger
            id: press-on
        then: !input on_press_action
        else: !input off_press_action
  
  - service: input_text.set_value
    target:
      entity_id: !input last_button_press_helper
    data:
      value: "{{ trigger.id }}"
      
  - service: input_number.set_value
    target:
      entity_id: !input last_press_time_helper
    data:
      value: "{{ now().timestamp() }}"

mode: single
max_exceeded: silent
